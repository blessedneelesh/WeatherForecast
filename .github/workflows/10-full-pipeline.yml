# =============================================================
# PHASE 10 — Full CI + CD Orchestrator (push → master / feature/**)
# Trigger  : push → master OR feature/**
# Goal     : Complete pipeline: CI → DB Migration → Package → Deploy → Release
#
# Wires together:
#   06-main-pipeline.yml              → CI stages 1-4
#   11-db-migration.yml               → DB migrations (dev / staging / production)
#   07-deploy-app-service.yml         → Stage 6 (staging) + Stage 9 (production)
#   09-auto-release-app-service.yml   → Stage 7 (GitHub Release)
#
# Stage sequence:
#   1  · Unit Tests + Coverage
#   2  · SonarQube Quality Gate  ─┐ parallel after tests
#   3  · Snyk Security Scan      ─┘
#   4  · Docker Build + Trivy → Push ACR
#   5a · DB Migration (dev)        ← feature/** branches only
#   5b · DB Migration (staging)    ← master only
#   6  · Deploy → App Service Staging
#   7  · Auto GitHub Release
#   8  · DB Migration (production) ← staging-and-production only
#   9  · Deploy → Production       ← staging-and-production + manual approval
#
# REQUIRED SECRETS (from phases 03/04/05/07/09):
#   SONAR_TOKEN, SONAR_HOST_URL
#   SNYK_TOKEN
#   AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#   AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   ACR_LOGIN_SERVER, ACR_USERNAME, ACR_PASSWORD
#
# REQUIRED VARIABLES (from phases 03/07/11):
#   SONAR_PROJECT_KEY, SONAR_ORGANIZATION
#   AZURE_RESOURCE_GROUP
#   AZURE_APP_SERVICE_NAME
#   AZURE_APP_SERVICE_SLOT_STAGING
#   PG_HOST, PG_ADMIN_USER, KEY_VAULT_URI
#   PG_DATABASE_DEV, PG_DATABASE_STAGING, PG_DATABASE_PRODUCTION
#   DB_PASSWORD_SECRET_NAME_DEV
#   DB_PASSWORD_SECRET_NAME_STAGING
#   DB_PASSWORD_SECRET_NAME_PRODUCTION
# =============================================================

name: "Phase 10 — 🚀 Full CI + CD Pipeline"

on:
  push:
    branches:
      - master
      - "feature/**"             # ← triggers dev DB migration on feature branches
  workflow_dispatch:
    inputs:
      deploy-target:
        description: "Deployment target"
        type: choice
        options: [staging-only, staging-and-production]
        default: staging-only
      skip-sonar:
        description: "Skip SonarQube scan (hotfix only)"
        type: boolean
        default: false
      skip-snyk:
        description: "Skip Snyk scan (hotfix only)"
        type: boolean
        default: false

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  IMAGE_NAME: "weatherforecast-api"
  COVERAGE_THRESHOLD: "0"

# ════════════════════════════════════════════════════════════
# STAGE 1 — Unit Tests & Coverage
# ════════════════════════════════════════════════════════════
jobs:
  test:
    name: "1 · Unit Tests & Coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests with coverage
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura \
               DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByAttribute=GeneratedCode,Obsolete

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"./TestResults/**/coverage.cobertura.xml" \
            -targetdir:"./TestResults/CoverageReport" \
            -reporttypes:"Html;MarkdownSummaryGithub;Cobertura" \
            -verbosity:Warning

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./TestResults/CoverageReport/
          retention-days: 30

      - name: Upload TRX results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-trx
          path: ./TestResults/*.trx
          retention-days: 14

      - name: Post test & coverage summary
        if: always()
        run: |
          echo "## 🧪 Stage 1 — Unit Tests & Coverage" >> $GITHUB_STEP_SUMMARY
          echo "_$(date +'%Y-%m-%d %H:%M UTC')_" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          TRX=$(find ./TestResults -name "*.trx" | head -1)
          if [ -f "$TRX" ]; then
            TOTAL=$(grep -o 'total="[0-9]*"'    "$TRX" | grep -o '[0-9]*' | head -1)
            PASSED=$(grep -o 'passed="[0-9]*"'  "$TRX" | grep -o '[0-9]*' | head -1)
            FAILED=$(grep -o 'failed="[0-9]*"'  "$TRX" | grep -o '[0-9]*' | head -1)
            SKIPPED=$(grep -o 'skipped="[0-9]*"' "$TRX" | grep -o '[0-9]*' | head -1)
            echo "| Result | Count |"                   >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|"                   >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed  | ${PASSED:-0}  |"       >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed  | ${FAILED:-0}  |"       >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️ Skipped | ${SKIPPED:-0} |"       >> $GITHUB_STEP_SUMMARY
            echo "| 📊 Total   | ${TOTAL:-0}   |"       >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "./TestResults/CoverageReport/SummaryGithub.md" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## 📊 Code Coverage" >> $GITHUB_STEP_SUMMARY
            cat "./TestResults/CoverageReport/SummaryGithub.md" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Enforce coverage threshold (${{ env.COVERAGE_THRESHOLD }}%)
        run: |
          COVERAGE_FILE=$(find ./TestResults -name "coverage.cobertura.xml" | head -1)
          if [ -f "$COVERAGE_FILE" ]; then
            LINE_RATE=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('$COVERAGE_FILE')
          root = tree.getroot()
          rate = float(root.attrib.get('line-rate', 0)) * 100
          print(f'{rate:.1f}')
          ")
            echo "Line coverage: ${LINE_RATE}%"
            THRESHOLD=${{ env.COVERAGE_THRESHOLD }}
            if (( $(echo "$LINE_RATE < $THRESHOLD" | bc -l) )); then
              echo "::error::Coverage ${LINE_RATE}% is below the required ${THRESHOLD}% threshold."
              exit 1
            fi
            echo "✅ Coverage ${LINE_RATE}% meets the ${THRESHOLD}% threshold."
          fi

  # ════════════════════════════════════════════════════════════
  # STAGE 2 — SonarQube Analysis (parallel with Snyk)
  # ════════════════════════════════════════════════════════════
  sonarqube:
    name: "2 · SonarQube Analysis"
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !inputs.skip-sonar }}
    timeout-minutes: 30

    steps:
      - name: Checkout (full history for blame)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17 (SonarQube scanner dependency)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache SonarQube scanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-sonar-

      - name: Install SonarQube scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore

      - name: Begin SonarQube analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="**/TestResults/*.trx" \
            /d:sonar.qualitygate.wait=false \
            /d:sonar.exclusions="**/Migrations/**,**/wwwroot/**,**/*.Designer.cs" \
            /d:sonar.coverage.exclusions="**/*Tests*/**,**/Program.cs,**/Startup.cs" \
            /d:sonar.cpd.exclusions="**/Migrations/**"

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with coverage (opencover)
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --logger trx \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Move coverage file to root
        run: |
          COVERAGE_FILE=$(find ./TestResults -name "coverage.opencover.xml" -type f | head -n 1)
          if [ -n "$COVERAGE_FILE" ]; then
            cp "$COVERAGE_FILE" ./coverage.opencover.xml
          else
            echo "❌ No coverage.opencover.xml found"
            exit 1
          fi

      - name: End SonarQube analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Post SonarQube summary
        if: always()
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          echo "## 🔍 Stage 2 — SonarQube Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Project   | \`$SONAR_PROJECT_KEY\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch    | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard | [Open in SonarQube]($SONAR_HOST_URL/dashboard?id=$SONAR_PROJECT_KEY) |" >> $GITHUB_STEP_SUMMARY

  # ════════════════════════════════════════════════════════════
  # STAGE 3 — Snyk Security Scan (parallel with SonarQube)
  # ════════════════════════════════════════════════════════════
  snyk:
    name: "3 · Snyk Security Scan"
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !inputs.skip-snyk }}
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Snyk dependency test
        id: snyk-scan
        uses: snyk/actions/dotnet@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >
            --severity-threshold=high
            --sarif-file-output=snyk-deps.sarif
            --all-projects
            --detection-depth=4

      - name: Verify and process SARIF file
        id: verify-sarif
        run: |
          if [ -f "snyk-deps.sarif" ]; then
            echo "has_sarif=true" >> $GITHUB_OUTPUT
            which jq || sudo apt-get update && sudo apt-get install -y jq
            run_count=$(jq '.runs | length' snyk-deps.sarif 2>/dev/null || echo "1")
            echo "run_count=$run_count" >> $GITHUB_OUTPUT
            if [ "$run_count" -gt 1 ]; then
              echo "needs_split=true" >> $GITHUB_OUTPUT
              index=0
              jq -c '.runs[]' snyk-deps.sarif | while IFS= read -r run; do
                index=$((index + 1))
                sarif_file="snyk-deps-${index}.sarif"
                echo "{\"version\": \"2.1.0\", \"\$schema\": \"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json\", \"runs\": [$run]}" > "$sarif_file"
              done
            else
              echo "needs_split=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_sarif=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload single SARIF file
        if: steps.verify-sarif.outputs.has_sarif == 'true' && steps.verify-sarif.outputs.needs_split == 'false'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-deps.sarif
          category: snyk-dotnet-dependencies

      - name: Upload split SARIF files
        if: steps.verify-sarif.outputs.has_sarif == 'true' && steps.verify-sarif.outputs.needs_split == 'true'
        run: |
          index=0
          for sarif_file in snyk-deps-*.sarif; do
            if [ -f "$sarif_file" ]; then
              index=$((index + 1))
              project_name=$(jq -r '.runs[0].tool.driver.name // "project-'$index'"' "$sarif_file" | tr '[:upper:]' '[:lower:]' | tr ' /.\\' '-')
              category="snyk-dotnet-${project_name}-${{ github.run_id }}"
              gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${{ github.repository }}/code-scanning/sarifs" \
                -f "commit_sha=${{ github.sha }}" \
                -f "ref=${{ github.ref }}" \
                -f "sarif=@$sarif_file" \
                -f "tool_name=Snyk" \
                -f "category=$category" || echo "⚠️ Upload failed for $sarif_file"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce Snyk gate (monitoring mode)
        if: steps.snyk-scan.outcome == 'failure'
        run: |
          echo "::warning::Snyk found HIGH or CRITICAL vulnerabilities (monitor mode)"
          echo "⚠️ **Snyk - Monitoring Mode:** HIGH/CRITICAL vulnerabilities detected." >> $GITHUB_STEP_SUMMARY
          # exit 1  # Temporarily disabled for investigation

      - name: Post Snyk summary
        if: always()
        run: |
          echo "## 🛡️ Stage 3 — Snyk Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Severity threshold | HIGH + CRITICAL |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.snyk-scan.outcome }}" == "failure" ]; then
            echo "| Status | ⚠️ Vulnerabilities detected (monitoring mode) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Status | ✅ No vulnerabilities found |" >> $GITHUB_STEP_SUMMARY
          fi

  # ════════════════════════════════════════════════════════════
  # STAGE 4 — Docker Build + Trivy Scan + Push to ACR
  # needs: [sonarqube, snyk] — BOTH gates must pass
  # ════════════════════════════════════════════════════════════
  package:
    name: "4 · Docker Build & Push to ACR"
    runs-on: ubuntu-latest
    needs: [sonarqube, snyk]
    timeout-minutes: 30

    permissions:
      contents: read
      actions: read
      security-events: write

    outputs:
      short-tag:  ${{ steps.short.outputs.tag }}
      full-image: ${{ steps.short.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore & Build
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release

      - name: Final test gate
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=final-test-results.trx" \
            --results-directory ./TestResults

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:master

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":       "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":       "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=WeatherForecast API
            org.opencontainers.image.description=.NET 8 Web API
            org.opencontainers.image.vendor=YourOrg

      - name: Extract short tag + full image
        id: short
        run: |
          SHORT="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          FULL="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${SHORT}"
          echo "tag=${SHORT}"  >> $GITHUB_OUTPUT
          echo "image=${FULL}" >> $GITHUB_OUTPUT

      - name: Build image (local, for Trivy scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DOTNET_VERSION=${{ env.DOTNET_VERSION }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

      - name: Trivy vulnerability scan (pre-push gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"

      - name: Trivy SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Upload Trivy SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Push image to ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pipeline summary
        if: always()
        run: |
          echo "## 📦 Stage 4 — Docker Build & Push" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 1 · Unit Tests   | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 · SonarQube    | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 · Snyk         | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 · Docker + ACR | ✅ Pushed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ steps.short.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ════════════════════════════════════════════════════════════
  # STAGE 5a — DB Migration (dev)
  # Calls: 11-db-migration.yml with environment: dev
  # Runs on: feature/** branches only (NOT master)
  # needs: package — image must be built before migrating
  # If migration FAILS → feature branch deploy is skipped
  # Staging + Production databases are completely unaffected
  # ════════════════════════════════════════════════════════════
  db-migration-dev:
    name: "5a · DB Migration (dev)"
    needs: package
    if: ${{ github.ref != 'refs/heads/master' }}
    uses: ./.github/workflows/11-db-migration.yml
    with:
      environment: dev
    secrets: inherit

  # ════════════════════════════════════════════════════════════
  # STAGE 5b — DB Migration (staging)
  # Calls: 11-db-migration.yml with environment: staging
  # Runs on: master only
  # needs: package — image must be built before migrating
  # If migration FAILS → staging deploy SKIPPED, production never reached
  # Dev + Production databases are completely unaffected
  # ════════════════════════════════════════════════════════════
  db-migration-staging:
    name: "5b · DB Migration (staging)"
    needs: package
    if: ${{ github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/11-db-migration.yml
    with:
      environment: staging
    secrets: inherit

  # ════════════════════════════════════════════════════════════
  # STAGE 6 — Deploy to Azure App Service Staging
  # Calls: 07-deploy-app-service.yml
  # needs: [package, db-migration-staging]
  #   → db-migration-staging MUST pass before app is deployed
  #   → ensures schema is always migrated before new code runs
  # Runs on: master only
  # ════════════════════════════════════════════════════════════
  deploy-staging:
    name: "6 · Deploy → App Service Staging"
    needs: [package, db-migration-staging]
    if: ${{ github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/07-app-service-deploy.yml
    with:
      image-tag:   ${{ needs.package.outputs.short-tag }}
      environment: staging
    secrets: inherit

  # ════════════════════════════════════════════════════════════
  # STAGE 7 — Auto GitHub Release
  # Calls: 09-auto-release-app-service.yml
  # needs: [package, deploy-staging]
  #   → release only created when staging is healthy
  # ════════════════════════════════════════════════════════════
  auto-release:
    name: "7 · Create GitHub Release"
    needs: [package, deploy-staging]
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/09-release.yml
    with:
      image-tag: ${{ needs.package.outputs.short-tag }}
    secrets: inherit

  # ════════════════════════════════════════════════════════════
  # STAGE 8 — DB Migration (production)
  # Calls: 11-db-migration.yml with environment: production
  # needs: [package, auto-release]
  #   → release must exist before production migration runs
  # Only triggered when: deploy-target == staging-and-production
  # If migration FAILS → production deploy SKIPPED
  # Staging continues running fine on its own schema
  # ════════════════════════════════════════════════════════════
  db-migration-production:
    name: "8 · DB Migration (production)"
    needs: [package, auto-release]
    if: ${{ inputs.deploy-target == 'staging-and-production' }}
    uses: ./.github/workflows/11-db-migration.yml
    with:
      environment: production
    secrets: inherit

  # ════════════════════════════════════════════════════════════
  # STAGE 9 — Deploy to Production (manual approval gate)
  # Calls: 07-deploy-app-service.yml with environment: production
  # needs: [package, db-migration-production]
  #   → db-migration-production MUST pass before deploy runs
  #   → ensures production schema is migrated before new code
  # Only triggered when: deploy-target == staging-and-production
  #
  # Requires GitHub Environment protection rule:
  #   Repo → Settings → Environments → production
  #   → Required reviewers: [your team leads]
  #   → Pipeline pauses here until approved
  #
  # After approval: blue-green slot swap (staging → production)
  # ════════════════════════════════════════════════════════════
  deploy-production:
    name: "9 · Deploy → Production (manual approval)"
    needs: [package, db-migration-production]
    if: ${{ inputs.deploy-target == 'staging-and-production' }}
    uses: ./.github/workflows/07-app-service-deploy.yml
    with:
      image-tag:   ${{ needs.package.outputs.short-tag }}
      environment: production
    secrets: inherit