# =============================================================
# PHASE 3 — SonarQube Code Quality Analysis
# Trigger : pull_request → main/develop, push → main
# Goal    : Static analysis, code smells, duplication, gates
# Tools   : SonarQube (self-hosted or SonarCloud), .NET scanner
#
# REQUIRED SECRETS (set in repo Settings → Secrets):
#   SONAR_TOKEN      → SonarQube/SonarCloud user token
#   SONAR_HOST_URL   → e.g. https://sonarqube.yourcompany.com
#                      or https://sonarcloud.io for SonarCloud
#
# REQUIRED VARIABLES (set in repo Settings → Variables):
#   SONAR_PROJECT_KEY   → your-org_your-repo
#   SONAR_ORGANIZATION  → (SonarCloud only) your org key
# =============================================================

name: "🔍 Phase 3 — SonarQube Analysis"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  sonarqube:
    name: "SonarQube Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (full history for blame)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # SonarQube needs full git history for blame info

      # Java 17 is required by the SonarQube scanner
      - name: Setup Java 17 (SonarQube scanner dependency)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Cache SonarQube scanner packages between runs
      - name: Cache SonarQube scanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-sonar-

      # Install the SonarQube .NET scanner tool globally
      - name: Install SonarQube scanner
        run: |
          dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore

      # --------------------------------------------------------
      # BEGIN SonarQube scan
      # The scanner wraps the build step to intercept the compiler
      # and collect symbol information for analysis.
      # --------------------------------------------------------
      - name: Begin SonarQube analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="**/TestResults/*.trx" \
            /d:sonar.qualitygate.wait=false \
            /d:sonar.exclusions="**/Migrations/**,**/wwwroot/**,**/*.Designer.cs" \
            /d:sonar.coverage.exclusions="**/*Tests*/**,**/Program.cs,**/Startup.cs" \
            /d:sonar.cpd.exclusions="**/Migrations/**"

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Collect test coverage using Coverlet (more reliable than dotnet-coverage)
      - name: Run tests with coverage
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --logger trx \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      # Move coverage file to root for SonarScanner
      - name: Move coverage file
        run: |
          echo "Searching for coverage files..."
          find ./TestResults -name "coverage.opencover.xml" -type f
          
          # Find and copy the coverage file to root
          COVERAGE_FILE=$(find ./TestResults -name "coverage.opencover.xml" -type f | head -n 1)
          
          if [ -n "$COVERAGE_FILE" ]; then
            echo "✅ Found coverage file: $COVERAGE_FILE"
            cp "$COVERAGE_FILE" ./coverage.opencover.xml
            echo "File size: $(du -h ./coverage.opencover.xml | cut -f1)"
            echo "First 20 lines:"
            head -n 20 ./coverage.opencover.xml
          else
            echo "❌ No coverage.opencover.xml file found!"
            echo "All files in TestResults:"
            find ./TestResults -type f
            exit 1
          fi

      # END the scan — this uploads results to SonarQube server
      - name: End SonarQube analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      # Post a summary with the SonarQube dashboard link
      - name: Post SonarQube summary
        if: always()
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          echo "## 🔍 SonarQube Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Project | \`$SONAR_PROJECT_KEY\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch  | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard | [Open in SonarQube]($SONAR_HOST_URL/dashboard?id=$SONAR_PROJECT_KEY) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** Quality Gate status is informational only and does not block the workflow." >> $GITHUB_STEP_SUMMARY
