# =============================================================
# PHASE 6 — Main CI Orchestrator
# Trigger : push → main, workflow_dispatch
# Goal    : Sequence all CI stages with hard gate dependencies
#           Stage 1 → Tests & Coverage
#           Stage 2 → SonarQube Analysis    (needs: test)
#           Stage 3 → Snyk Security Scan    (needs: test)
#           Stage 4 → Docker Build & Push   (needs: sonarqube + snyk)
#
# Each stage only runs if ALL previous required stages passed.
# A failing test blocks SonarQube. A Snyk CRITICAL blocks Docker push.
#
# REQUIRED SECRETS (shared with phases 03/04/05):
#   SONAR_TOKEN           → SonarQube/SonarCloud user token
#   SONAR_HOST_URL        → https://sonarcloud.io or self-hosted URL
#   SNYK_TOKEN            → from https://app.snyk.io/account
#   AZURE_CLIENT_ID       → Service principal app ID
#   AZURE_CLIENT_SECRET   → Service principal secret
#   AZURE_TENANT_ID       → Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID → Azure subscription ID
#   ACR_LOGIN_SERVER      → e.g. myregistry.azurecr.io
#   ACR_USERNAME          → ACR admin username
#   ACR_PASSWORD          → ACR admin password
#
# REQUIRED VARIABLES (repo Settings → Variables):
#   SONAR_PROJECT_KEY     → your-org_weatherforecast
#   SONAR_ORGANIZATION    → your-org
#
# WORKFLOW LAYOUT (recommended):
#   01-fast-feedback.yml    → feature/** branches — compile only
#   02-quality-control.yml  → pull_request → main
#   06-main-pipeline.yml    → push → main — THIS FILE (full CI)
#   03/04/05 kept but not double-triggered on main
# =============================================================

name: "🚀 Phase 6 — Main CI Pipeline"

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      skip-sonar:
        description: "Skip SonarQube scan (use for hotfixes only)"
        type: boolean
        default: false
      skip-snyk:
        description: "Skip Snyk scan (use for hotfixes only)"
        type: boolean
        default: false

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  IMAGE_NAME: "weatherforecast-api"
  # Minimum coverage threshold — must match 02-quality-control.yml
  COVERAGE_THRESHOLD: "0"

# ──────────────────────────────────────────────────────────────
# STAGE 1 — Unit Tests & Coverage
# Mirrors 02-quality-control.yml exactly.
# All downstream stages depend on this job passing.
# ──────────────────────────────────────────────────────────────
jobs:
  test:
    name: "1 · Unit Tests & Coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Full history needed by SonarQube in Stage 2

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Cache key matches 02-quality-control.yml exactly
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Cobertura format — consumed by ReportGenerator in summary step
      # Matches 02-quality-control.yml collector configuration exactly
      - name: Run unit tests with coverage
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura \
               DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByAttribute=GeneratedCode,Obsolete

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"./TestResults/**/coverage.cobertura.xml" \
            -targetdir:"./TestResults/CoverageReport" \
            -reporttypes:"Html;MarkdownSummaryGithub;Cobertura" \
            -verbosity:Warning

      # Upload HTML report as artifact — downloadable from Actions tab
      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./TestResults/CoverageReport/
          retention-days: 30

      # Upload raw TRX for debugging
      - name: Upload TRX results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-trx
          path: ./TestResults/*.trx
          retention-days: 14

      # Rich Markdown summary — matches 02-quality-control.yml output format
      - name: Post test & coverage summary
        if: always()
        run: |
          echo "## 🧪 Stage 1 — Unit Tests & Coverage" >> $GITHUB_STEP_SUMMARY
          echo "_$(date +'%Y-%m-%d %H:%M UTC')_" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TRX=$(find ./TestResults -name "*.trx" | head -1)
          if [ -f "$TRX" ]; then
            TOTAL=$(grep -o 'total="[0-9]*"'    "$TRX" | grep -o '[0-9]*' | head -1)
            PASSED=$(grep -o 'passed="[0-9]*"'  "$TRX" | grep -o '[0-9]*' | head -1)
            FAILED=$(grep -o 'failed="[0-9]*"'  "$TRX" | grep -o '[0-9]*' | head -1)
            SKIPPED=$(grep -o 'skipped="[0-9]*"' "$TRX" | grep -o '[0-9]*' | head -1)

            echo "| Result | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed  | ${PASSED:-0}  |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed  | ${FAILED:-0}  |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️ Skipped | ${SKIPPED:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| 📊 Total   | ${TOTAL:-0}   |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f "./TestResults/CoverageReport/SummaryGithub.md" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## 📊 Code Coverage" >> $GITHUB_STEP_SUMMARY
            cat "./TestResults/CoverageReport/SummaryGithub.md" >> $GITHUB_STEP_SUMMARY
          fi

      # Enforce minimum coverage threshold — matches 02-quality-control.yml logic
      - name: Enforce coverage threshold (${{ env.COVERAGE_THRESHOLD }}%)
        run: |
          COVERAGE_FILE=$(find ./TestResults -name "coverage.cobertura.xml" | head -1)
          if [ -f "$COVERAGE_FILE" ]; then
            LINE_RATE=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('$COVERAGE_FILE')
          root = tree.getroot()
          rate = float(root.attrib.get('line-rate', 0)) * 100
          print(f'{rate:.1f}')
          ")
            echo "Line coverage: ${LINE_RATE}%"
            THRESHOLD=${{ env.COVERAGE_THRESHOLD }}
            if (( $(echo "$LINE_RATE < $THRESHOLD" | bc -l) )); then
              echo "::error::Coverage ${LINE_RATE}% is below the required ${THRESHOLD}% threshold."
              echo "❌ **Coverage gate failed:** ${LINE_RATE}% < ${THRESHOLD}% required" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
            echo "✅ Coverage ${LINE_RATE}% meets the ${THRESHOLD}% threshold."
          fi

  # ──────────────────────────────────────────────────────────────
  # STAGE 2 — SonarQube Analysis
  # needs: test → only runs if Stage 1 passes
  # Mirrors 03-sonarqube.yml exactly (Java 17, dotnet-sonarscanner,
  # opencover format, full git history).
  # Can be skipped via workflow_dispatch input skip-sonar: true
  # ──────────────────────────────────────────────────────────────
  sonarqube:
    name: "2 · SonarQube Analysis"
    runs-on: ubuntu-latest
    needs: test                          # ← GATE: blocks if tests fail
    if: ${{ !inputs.skip-sonar }}
    timeout-minutes: 30

    steps:
      - name: Checkout (full history for blame)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # SonarQube requires full git history for blame

      # Java 17 required by dotnet-sonarscanner — matches 03-sonarqube.yml
      - name: Setup Java 17 (SonarQube scanner dependency)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Cache SonarQube scanner packages — matches 03-sonarqube.yml
      - name: Cache SonarQube scanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-sonar-

      - name: Install SonarQube scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore

      # Begin scan — exclusions match 03-sonarqube.yml exactly
      - name: Begin SonarQube analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="**/TestResults/*.trx" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.exclusions="**/Migrations/**,**/wwwroot/**,**/*.Designer.cs" \
            /d:sonar.coverage.exclusions="**/*Tests*/**,**/Program.cs,**/Startup.cs" \
            /d:sonar.cpd.exclusions="**/Migrations/**"

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # opencover format — matches 03-sonarqube.yml collector format
      - name: Run tests with coverage (opencover)
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --logger trx \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      # Move coverage file to root — matches 03-sonarqube.yml step exactly
      - name: Move coverage file to root
        run: |
          COVERAGE_FILE=$(find ./TestResults -name "coverage.opencover.xml" -type f | head -n 1)
          if [ -n "$COVERAGE_FILE" ]; then
            echo "✅ Found: $COVERAGE_FILE"
            cp "$COVERAGE_FILE" ./coverage.opencover.xml
          else
            echo "❌ No coverage.opencover.xml found"
            find ./TestResults -type f
            exit 1
          fi

      - name: End SonarQube analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      # Summary with dashboard link — matches 03-sonarqube.yml output
      - name: Post SonarQube summary
        if: always()
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          echo "## 🔍 Stage 2 — SonarQube Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Project   | \`$SONAR_PROJECT_KEY\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch    | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard | [Open in SonarQube]($SONAR_HOST_URL/dashboard?id=$SONAR_PROJECT_KEY) |" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────
  # STAGE 3 — Snyk Security Scan
  # needs: test → only runs if Stage 1 passes
  # Runs in PARALLEL with SonarQube (both need: test, not each other)
  # Mirrors 04-snyk.yml job snyk-dependencies exactly.
  # Can be skipped via workflow_dispatch input skip-snyk: true
  # ──────────────────────────────────────────────────────────────
  snyk:
    name: "3 · Snyk Security Scan"
    runs-on: ubuntu-latest
    needs: test                          # ← GATE: blocks if tests fail
    if: ${{ !inputs.skip-snyk }}
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write             # Required to upload SARIF

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      # Matches 04-snyk.yml snyk-dependencies job args exactly
      # continue-on-error: true here so SARIF is always uploaded
      # Enforcement is handled by --fail-on=all below
      - name: Snyk dependency test
        uses: snyk/actions/dotnet@master
        continue-on-error: true          # Upload SARIF even on findings
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >
            --severity-threshold=high
            --sarif-file-output=snyk-deps.sarif
            --all-projects
            --detection-depth=4
            --fail-on=all

      # Verify SARIF was generated before uploading
      - name: Verify SARIF file
        id: verify-sarif
        run: |
          if [ -f "snyk-deps.sarif" ]; then
            echo "has_sarif=true" >> $GITHUB_OUTPUT
            echo "✅ SARIF file found ($(wc -l < snyk-deps.sarif) lines)"
          else
            echo "has_sarif=false" >> $GITHUB_OUTPUT
            echo "⚠️ No SARIF file generated"
          fi

      # Upload to GitHub Security tab — requires security-events: write
      - name: Upload Snyk SARIF to Security tab
        if: steps.verify-sarif.outputs.has_sarif == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-deps.sarif
          category: snyk-main-ci

      # Enforcement step — this is what actually blocks the pipeline
      # Separated from the scan step so SARIF always uploads first
      - name: Enforce Snyk gate (block on HIGH/CRITICAL)
        uses: snyk/actions/dotnet@master
        continue-on-error: false         # ← HARD BLOCK on HIGH/CRITICAL
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >
            --severity-threshold=high
            --fail-on=all
            --all-projects
            --detection-depth=4

      - name: Post Snyk summary
        if: always()
        run: |
          echo "## 🛡️ Stage 3 — Snyk Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Severity threshold | HIGH + CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Scope | All projects, depth 4 |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.verify-sarif.outputs.has_sarif }}" == "true" ]; then
            echo "| SARIF | ✅ Uploaded to [Security tab](https://github.com/${{ github.repository }}/security/code-scanning) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| SARIF | ⚠️ Not generated |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Full results: [app.snyk.io](https://app.snyk.io)" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────
  # STAGE 4 — Docker Build, Trivy Scan & Push to ACR
  # needs: [sonarqube, snyk] → BOTH security gates must pass
  # Mirrors 05-docker-build-push.yml exactly:
  #   build locally → Trivy scan → push only if CRITICAL-free
  # ──────────────────────────────────────────────────────────────
  package:
    name: "4 · Docker Build & Push to ACR"
    runs-on: ubuntu-latest
    needs: [sonarqube, snyk]             # ← GATE: both must pass
    timeout-minutes: 30

    permissions:
      contents: read
      actions: read
      security-events: write             # Trivy SARIF upload

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore & Build
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release

      # Final test gate before packaging — matches 05-docker-build-push.yml
      - name: Final test gate
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=final-test-results.trx" \
            --results-directory ./TestResults

      # Set up Docker Buildx — matches 05-docker-build-push.yml
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:master

      # Azure login — uses same secrets as 05-docker-build-push.yml
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":       "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":       "${{ secrets.AZURE_TENANT_ID }}"
            }

      # Login to ACR — matches 05-docker-build-push.yml
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Tags match 05-docker-build-push.yml exactly:
      #   sha-<short> always, latest on main, semver on tag push
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=WeatherForecast API
            org.opencontainers.image.description=.NET 8 Web API
            org.opencontainers.image.vendor=YourOrg

      # Build into local daemon first — DO NOT push yet
      # Shift-left: scan before push — matches 05-docker-build-push.yml
      - name: Build image (local, for Trivy scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true                     # Load into local Docker daemon
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DOTNET_VERSION=${{ env.DOTNET_VERSION }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

      # Trivy pre-push gate — exit-code: 1 blocks push on CRITICAL
      # Matches 05-docker-build-push.yml Trivy args exactly
      - name: Trivy vulnerability scan (pre-push gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"

      # Upload Trivy findings as SARIF to Security tab
      - name: Trivy SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Upload Trivy SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      # Push to ACR — only reaches here if Trivy scan passed
      - name: Push image to ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Final pipeline summary — all 4 stages
      - name: Pipeline summary
        if: always()
        run: |
          echo "# 🚀 Phase 6 — Main CI Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 1 · Unit Tests & Coverage | xUnit + Coverlet  | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 · SonarQube Analysis    | dotnet-sonarscanner | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 · Snyk Security Scan    | Snyk CLI          | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 · Docker Build & Push   | Trivy + ACR       | ✅ Pushed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ secrets.ACR_LOGIN_SERVER }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Triggered by: @${{ github.actor }} on \`${{ github.ref_name }}\`_" >> $GITHUB_STEP_SUMMARY