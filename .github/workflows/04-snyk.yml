# =============================================================
# PHASE 4 — Snyk Security Scanning
# Trigger : push → main/develop, pull_request → main
# Goal    : Scan NuGet dependencies + Docker image for CVEs
# Tools   : Snyk CLI, snyk/actions
#
# REQUIRED SECRETS:
#   SNYK_TOKEN  → from https://app.snyk.io/account (API token)
#
# HOW TO GET YOUR SNYK_TOKEN:
#   1. Sign up at https://app.snyk.io (free tier available)
#   2. Go to Account Settings → API Token
#   3. Copy the token → add as repo secret SNYK_TOKEN
# =============================================================

name: "🛡️ Phase 4 — Snyk Security"

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
  # Weekly scan to catch newly published CVEs
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true

jobs:
  # -----------------------------------------------------------
  # JOB 1: Snyk — NuGet dependency vulnerability scan
  # Scans all .csproj files for known vulnerable packages
  # -----------------------------------------------------------
  snyk-dependencies:
    name: "Snyk — NuGet Dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write    # Upload SARIF to Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      # Run Snyk dependency scan
      # --severity-threshold=high → only fail on HIGH and CRITICAL
      # --sarif-file-output      → upload to GitHub Security tab
      - name: Snyk dependency test
        uses: snyk/actions/dotnet@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >
            --severity-threshold=high
            --sarif-file-output=snyk-deps.sarif
            --all-projects
            --detection-depth=4

      # Check if SARIF file exists
      - name: Verify SARIF file
        id: verify-sarif
        run: |
          if [ -f "snyk-deps.sarif" ]; then
            echo "✅ SARIF file found"
            echo "has_sarif=true" >> $GITHUB_OUTPUT
            
            # Show file info for debugging
            ls -lh snyk-deps.sarif
            echo "First 20 lines:"
            head -n 20 snyk-deps.sarif  
          else
            echo "No SARIF file found"
            echo "has_sarif=false" >> $GITHUB_OUTPUT
          fi

      # Split SARIF if it contains multiple runs and upload each separately
      - name: Split and upload multi-run SARIF
        if: steps.verify-sarif.outputs.needs_split == 'true'
        run: |
          # Install jq if not available
          which jq || sudo apt-get update && sudo apt-get install -y jq
          
          # Split SARIF into separate files and upload each
          index=0
          jq -c '.runs[]' snyk-deps.sarif | while IFS= read -r run; do
            index=$((index + 1))
            tool_name=$(echo "$run" | jq -r '.tool.driver.name // "snyk"' | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
            
            # Create a new SARIF file with single run
            sarif_file="snyk-deps-${index}.sarif"
            echo "{\"version\": \"2.1.0\", \"\$schema\": \"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json\", \"runs\": [$run]}" > "$sarif_file"
            
            echo "Created $sarif_file for $tool_name"

            # Upload each split SARIF file individually
            echo "Uploading $sarif_file..."
            curl -X POST "https://api.github.com/repos/${{ github.repository }}/code-scanning/sarifs" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              -d "{
                \"sarif\": $(< $sarif_file),
                \"tool_name\": \"snyk\",
                \"category\": \"snyk-dotnet-dependencies\"
              }"
          done
          
          echo "Split and upload complete"

      # Upload single SARIF file (when no splitting needed)
      - name: Upload single SARIF file
        if: steps.verify-sarif.outputs.has_sarif == 'true' && steps.verify-sarif.outputs.needs_split == 'false'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-deps.sarif
          category: snyk-dotnet-dependencies

      # Upload merged SARIF (for split case)
      - name: Upload merged SARIF
        if: steps.verify-sarif.outputs.has_sarif == 'true' && steps.verify-sarif.outputs.needs_split == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-deps-merged.sarif
          category: snyk-dotnet-dependencies

      # Post a summary
      - name: Snyk dependency summary
        if: always()
        run: |
          echo "## 🛡️ Snyk — NuGet Dependency Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.verify-sarif.outputs.has_sarif }}" == "true" ]; then
            echo "✅ Scan completed successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ "${{ steps.verify-sarif.outputs.needs_split }}" == "true" ]; then
              echo "ℹ️ Multiple project results merged into single report" >> $GITHUB_STEP_SUMMARY
            fi
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Results uploaded to the [Security tab](https://github.com/${{ github.repository }}/security/code-scanning)." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No SARIF file generated (no vulnerabilities found or scan failed)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Snyk monitors: [app.snyk.io](https://app.snyk.io)" >> $GITHUB_STEP_SUMMARY

  # -----------------------------------------------------------
  # JOB 2: Snyk — Docker image vulnerability scan
  # Builds the image locally and scans OS + runtime layers
  # -----------------------------------------------------------
  snyk-container:
    name: "Snyk — Docker Image Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: snyk-dependencies

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Check if Dockerfile exists before proceeding
      - name: Check for Dockerfile
        id: check-dockerfile
        run: |
          if [ -f "Dockerfile" ]; then
            echo "dockerfile_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Dockerfile found"
          else
            echo "dockerfile_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ No Dockerfile found - skipping container scan"
          fi

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        if: steps.check-dockerfile.outputs.dockerfile_exists == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Build the Docker image locally (do not push — scan first)
      - name: Build Docker image for scanning
        if: steps.check-dockerfile.outputs.dockerfile_exists == 'true'
        run: |
          docker build \
            --tag weatherforecast-api:snyk-scan \
            --file Dockerfile \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .

      # Scan the container image with Snyk
      # --file=Dockerfile → gives Snyk base image context
      - name: Snyk container test
        if: steps.check-dockerfile.outputs.dockerfile_exists == 'true'
        uses: snyk/actions/docker@master
        continue-on-error: true    # Fail if vulnerabilities found
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: weatherforecast-api:snyk-scan
          args: >
            --file=Dockerfile
            --severity-threshold=high
            --sarif-file-output=snyk-container.sarif
            --exclude-base-image-vulns

      - name: Verify container SARIF
        if: steps.check-dockerfile.outputs.dockerfile_exists == 'true'
        id: verify-container-sarif
        run: |
          if [ -f "snyk-container.sarif" ]; then
            echo "has_container_sarif=true" >> $GITHUB_OUTPUT
            echo "✅ Container SARIF file found"
          else
            echo "has_container_sarif=false" >> $GITHUB_OUTPUT
            echo "⚠️ No container SARIF file generated"
          fi

      - name: Upload Snyk container SARIF to Security tab
        if: steps.check-dockerfile.outputs.dockerfile_exists == 'true' && steps.verify-container-sarif.outputs.has_container_sarif == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-container.sarif
          category: snyk-container-image

      - name: Snyk container summary
        if: always()
        run: |
          echo "## 🐳 Snyk — Docker Image Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check-dockerfile.outputs.dockerfile_exists }}" == "true" ]; then
            echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Image | \`weatherforecast-api:snyk-scan\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Severity threshold | HIGH + CRITICAL |" >> $GITHUB_STEP_SUMMARY
            
            if [ "${{ steps.verify-container-sarif.outputs.has_container_sarif }}" == "true" ]; then
              echo "| Status | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
              echo "| Results | [Security tab](https://github.com/${{ github.repository }}/security/code-scanning) |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Status | ⚠️ No vulnerabilities found |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ Skipped - No Dockerfile found in repository" >> $GITHUB_STEP_SUMMARY
          fi

  # -----------------------------------------------------------
  # JOB 3: Snyk — IaC scan (Dockerfile, K8s manifests)
  # -----------------------------------------------------------
  snyk-iac:
    name: "Snyk — Infrastructure as Code"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: snyk-dependencies

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Check if any IaC files exist
      - name: Check for IaC files
        id: check-iac
        run: |
          if [ -f "Dockerfile" ] || [ -d "k8s" ] || ls *.yaml >/dev/null 2>&1 || ls *.yml >/dev/null 2>&1; then
            echo "iac_files_exist=true" >> $GITHUB_OUTPUT
            echo "✅ Infrastructure as Code files found"
          else
            echo "iac_files_exist=false" >> $GITHUB_OUTPUT
            echo "⚠️ No IaC files found - skipping IaC scan"
          fi

      - name: Snyk IaC scan
        if: steps.check-iac.outputs.iac_files_exist == 'true'
        uses: snyk/actions/iac@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >
            --sarif-file-output=snyk-iac.sarif
            --severity-threshold=medium

      - name: Verify IaC SARIF
        if: steps.check-iac.outputs.iac_files_exist == 'true'
        id: verify-iac-sarif
        run: |
          if [ -f "snyk-iac.sarif" ]; then
            echo "has_iac_sarif=true" >> $GITHUB_OUTPUT
            echo "✅ IaC SARIF file found"
          else
            echo "has_iac_sarif=false" >> $GITHUB_OUTPUT
            echo "⚠️ No IaC SARIF file generated"
          fi

      - name: Upload Snyk IaC SARIF to Security tab
        if: steps.check-iac.outputs.iac_files_exist == 'true' && steps.verify-iac-sarif.outputs.has_iac_sarif == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-iac.sarif
          category: snyk-iac

      - name: Snyk IaC summary
        if: always()
        run: |
          echo "## 🏗️ Snyk — Infrastructure as Code Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check-iac.outputs.iac_files_exist }}" == "true" ]; then
            if [ "${{ steps.verify-iac-sarif.outputs.has_iac_sarif }}" == "true" ]; then
              echo "✅ IaC scan completed" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Results uploaded to the [Security tab](https://github.com/${{ github.repository }}/security/code-scanning)." >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ No issues found in IaC files" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ Skipped - No IaC files found in repository" >> $GITHUB_STEP_SUMMARY
          fi
