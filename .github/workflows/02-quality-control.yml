# =============================================================
# PHASE 2 — Quality Control CI
# Trigger : pull_request targeting main or develop
# Goal    : Run unit tests, enforce coverage, post MD summary
# Tools   : .NET 8, xUnit/NUnit, Coverlet, ReportGenerator
# =============================================================

name: "✅ Phase 2 — Quality Control"

on:
  pull_request:
    branches:
      - master
      - develop
  # Also allow manual trigger for debugging
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Minimum code coverage threshold (%) — pipeline fails below this
  COVERAGE_THRESHOLD: "0"

jobs:
  # -----------------------------------------------------------
  # JOB: test
  # Runs the full unit test suite with code coverage collection
  # -----------------------------------------------------------
  test:
    name: "Unit Tests & Coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # NuGet cache — same key strategy as Phase 1
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Run tests with:
      #   - TRX format  → parsed for GitHub step summary
      #   - Cobertura   → consumed by ReportGenerator for HTML report
      #   - Coverlet    → collects line/branch/method coverage
      - name: Run unit tests with coverage
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura \
               DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByAttribute=GeneratedCode,Obsolete

      # Install ReportGenerator to convert Cobertura XML → HTML + summary
      - name: Install ReportGenerator
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate HTML coverage report
        run: |
          reportgenerator \
            -reports:"./TestResults/**/coverage.cobertura.xml" \
            -targetdir:"./TestResults/CoverageReport" \
            -reporttypes:"Html;MarkdownSummaryGithub;Cobertura" \
            -verbosity:Warning

      # Upload HTML coverage report as downloadable artifact
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./TestResults/CoverageReport/
          retention-days: 30

      # Upload raw TRX results
      - name: Upload TRX results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-trx
          path: ./TestResults/*.trx
          retention-days: 14

      # Write a rich Markdown job summary visible in the GitHub UI
      - name: Post test & coverage summary
        if: always()
        run: |
          echo "## 🧪 Test Results — $(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TRX=$(find ./TestResults -name "*.trx" | head -1)
          if [ -f "$TRX" ]; then
            TOTAL=$(grep -o 'total="[0-9]*"'   "$TRX" | grep -o '[0-9]*' | head -1)
            PASSED=$(grep -o 'passed="[0-9]*"'  "$TRX" | grep -o '[0-9]*' | head -1)
            FAILED=$(grep -o 'failed="[0-9]*"'  "$TRX" | grep -o '[0-9]*' | head -1)
            SKIPPED=$(grep -o 'skipped="[0-9]*"' "$TRX" | grep -o '[0-9]*' | head -1)

            echo "| Result | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed  | ${PASSED:-0}  |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed  | ${FAILED:-0}  |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️ Skipped | ${SKIPPED:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| 📊 Total   | ${TOTAL:-0}   |" >> $GITHUB_STEP_SUMMARY
          fi

          # Append the coverage markdown generated by ReportGenerator
          if [ -f "./TestResults/CoverageReport/SummaryGithub.md" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## 📊 Code Coverage" >> $GITHUB_STEP_SUMMARY
            cat "./TestResults/CoverageReport/SummaryGithub.md" >> $GITHUB_STEP_SUMMARY
          fi

      # Enforce minimum coverage threshold
      - name: Enforce coverage threshold (${{ env.COVERAGE_THRESHOLD }}%)
        run: |
          COVERAGE_FILE=$(find ./TestResults -name "coverage.cobertura.xml" | head -1)
          if [ -f "$COVERAGE_FILE" ]; then
            LINE_RATE=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('$COVERAGE_FILE')
          root = tree.getroot()
          rate = float(root.attrib.get('line-rate', 0)) * 100
          print(f'{rate:.1f}')
          ")
            echo "Line coverage: ${LINE_RATE}%"
            THRESHOLD=${{ env.COVERAGE_THRESHOLD }}
            if (( $(echo "$LINE_RATE < $THRESHOLD" | bc -l) )); then
              echo "::error::Coverage ${LINE_RATE}% is below the required ${THRESHOLD}% threshold."
              echo "❌ **Coverage gate failed:** ${LINE_RATE}% < ${THRESHOLD}% required" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
            echo "✅ Coverage ${LINE_RATE}% meets the ${THRESHOLD}% threshold."
          fi
