# =============================================================
# PHASE 12 — Production Rollback
# Trigger  : workflow_dispatch (manual only — never automatic)
# Goal     : Rollback production app AND/OR database
#
# Two rollback modes (choose at dispatch time):
#
#   app-only       → Blue-green swap back (instant, ~2 seconds)
#                    Restores previous app version from staging slot
#                    Use when: app bug, no schema change needed
#
#   app-and-db     → Swap back + run compensating SQL migration
#                    against dev → staging → production in order
#                    Use when: bad migration was applied to all envs
#
#   db-only        → Run compensating SQL migration only, no swap
#                    Use when: schema fix needed but app is fine
#
# ⚠️  DB rollback requires a compensating migration script to
#     already exist in migrations/ folder before running this.
#     Example: migrations/004_rollback_location_column.sql
#
# REQUIRED SECRETS:
#   AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#   AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#
# REQUIRED VARIABLES:
#   AZURE_RESOURCE_GROUP, AZURE_APP_SERVICE_NAME
#   AZURE_APP_SERVICE_SLOT_STAGING
#   PG_HOST, PG_ADMIN_USER, KEY_VAULT_URI
#   PG_DATABASE_DEV, PG_DATABASE_STAGING, PG_DATABASE_PRODUCTION
#   DB_PASSWORD_SECRET_NAME_DEV
#   DB_PASSWORD_SECRET_NAME_STAGING
#   DB_PASSWORD_SECRET_NAME_PRODUCTION
# =============================================================

name: "⏪ Phase 12 — Rollback"

on:
  workflow_dispatch:
    inputs:
      rollback-mode:
        description: "What to roll back"
        type: choice
        options:
          - app-only
          - app-and-db
          - db-only
        required: true
        default: app-only
      db-environments:
        description: "DB rollback environments (db-only / app-and-db modes)"
        type: choice
        options:
          - dev-only
          - staging-only
          - production-only
          - all-environments
        default: all-environments
      compensating-script:
        description: "Compensating SQL filename in migrations/ folder (e.g. 004_rollback_location_column.sql)"
        type: string
        required: false
      confirm-rollback:
        description: "Type ROLLBACK to confirm"
        type: string
        required: true
      reason:
        description: "Reason for rollback (shown in summary)"
        type: string
        required: true

jobs:
  # ════════════════════════════════════════════════════════════
  # JOB 1 — Confirm + validate inputs
  # ════════════════════════════════════════════════════════════
  confirm:
    name: "✋ Confirm Rollback"
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm-rollback }}" != "ROLLBACK" ]; then
            echo "::error::Type ROLLBACK in the confirm field to proceed."
            exit 1
          fi
          echo "✅ Rollback confirmed by @${{ github.actor }}"
          echo "📋 Mode   : ${{ inputs.rollback-mode }}"
          echo "📋 Reason : ${{ inputs.reason }}"

      - name: Validate db inputs
        if: ${{ inputs.rollback-mode != 'app-only' }}
        run: |
          if [ -z "${{ inputs.compensating-script }}" ]; then
            echo "::error::compensating-script is required for db-only and app-and-db modes."
            echo "::error::Example: 004_rollback_location_column.sql"
            exit 1
          fi
          echo "✅ Compensating script: migrations/${{ inputs.compensating-script }}"

  # ════════════════════════════════════════════════════════════
  # JOB 2 — DB Rollback (dev)
  # Runs when: db-only or app-and-db + dev-only or all-environments
  # ════════════════════════════════════════════════════════════
  db-rollback-dev:
    name: "🗄️ DB Rollback (dev)"
    runs-on: ubuntu-latest
    needs: confirm
    if: |
      ${{ inputs.rollback-mode != 'app-only' &&
         (inputs.db-environments == 'dev-only' ||
          inputs.db-environments == 'all-environments') }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":       "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":       "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Fetch dev DB password from Key Vault
        id: secrets-dev
        run: |
          KV_NAME=$(echo "${{ vars.KEY_VAULT_URI }}" \
            | sed 's|https://||;s|.vault.azure.net/||')
          RAW=$(az keyvault secret show \
            --vault-name "$KV_NAME" \
            --name "${{ vars.DB_PASSWORD_SECRET_NAME_DEV }}" \
            --query value -o tsv)
          PG_PASS=$(echo "$RAW" | python3 -c "import sys,json; print(json.load(sys.stdin)['password'])")
          echo "::add-mask::$PG_PASS"
          echo "pg_pass=$PG_PASS" >> $GITHUB_OUTPUT

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Run compensating migration (dev)
        env:
          PGPASSWORD: ${{ steps.secrets-dev.outputs.pg_pass }}
        run: |
          SCRIPT="migrations/${{ inputs.compensating-script }}"

          if [ ! -f "$SCRIPT" ]; then
            echo "::error::Script not found: $SCRIPT"
            echo "::error::Make sure migrations/${{ inputs.compensating-script }} exists in the repo."
            exit 1
          fi

          echo "▶ Running compensating migration on dev: ${{ vars.PG_DATABASE_DEV }}"
          echo "→ Script: $SCRIPT"
          psql \
            --host="${{ vars.PG_HOST }}" \
            --username="${{ vars.PG_ADMIN_USER }}" \
            --dbname="${{ vars.PG_DATABASE_DEV }}" \
            --set ON_ERROR_STOP=1 \
            --file="$SCRIPT"
          echo "✅ Dev DB rollback complete."

      - name: Post dev DB rollback summary
        if: always()
        run: |
          echo "## 🗄️ DB Rollback — dev" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Database | \`${{ vars.PG_DATABASE_DEV }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Script   | \`${{ inputs.compensating-script }}\` |" >> $GITHUB_STEP_SUMMARY

  # ════════════════════════════════════════════════════════════
  # JOB 3 — DB Rollback (staging)
  # Runs when: db-only or app-and-db + staging-only or all-environments
  # needs: db-rollback-dev — dev must pass before staging
  # ════════════════════════════════════════════════════════════
  db-rollback-staging:
    name: "🗄️ DB Rollback (staging)"
    runs-on: ubuntu-latest
    needs: [confirm, db-rollback-dev]
    if: |
      ${{ always() &&
          needs.confirm.result == 'success' &&
          inputs.rollback-mode != 'app-only' &&
         (inputs.db-environments == 'staging-only' ||
          inputs.db-environments == 'all-environments') }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":       "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":       "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Fetch staging DB password from Key Vault
        id: secrets-staging
        run: |
          KV_NAME=$(echo "${{ vars.KEY_VAULT_URI }}" \
            | sed 's|https://||;s|.vault.azure.net/||')
          RAW=$(az keyvault secret show \
            --vault-name "$KV_NAME" \
            --name "${{ vars.DB_PASSWORD_SECRET_NAME_STAGING }}" \
            --query value -o tsv)
          PG_PASS=$(echo "$RAW" | python3 -c "import sys,json; print(json.load(sys.stdin)['password'])")
          echo "::add-mask::$PG_PASS"
          echo "pg_pass=$PG_PASS" >> $GITHUB_OUTPUT

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Run compensating migration (staging)
        env:
          PGPASSWORD: ${{ steps.secrets-staging.outputs.pg_pass }}
        run: |
          SCRIPT="migrations/${{ inputs.compensating-script }}"

          if [ ! -f "$SCRIPT" ]; then
            echo "::error::Script not found: $SCRIPT"
            exit 1
          fi

          echo "▶ Running compensating migration on staging: ${{ vars.PG_DATABASE_STAGING }}"
          echo "→ Script: $SCRIPT"
          psql \
            --host="${{ vars.PG_HOST }}" \
            --username="${{ vars.PG_ADMIN_USER }}" \
            --dbname="${{ vars.PG_DATABASE_STAGING }}" \
            --set ON_ERROR_STOP=1 \
            --file="$SCRIPT"
          echo "✅ Staging DB rollback complete."

      - name: Post staging DB rollback summary
        if: always()
        run: |
          echo "## 🗄️ DB Rollback — staging" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Database | \`${{ vars.PG_DATABASE_STAGING }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Script   | \`${{ inputs.compensating-script }}\` |" >> $GITHUB_STEP_SUMMARY

  # ════════════════════════════════════════════════════════════
  # JOB 4 — DB Rollback (production)
  # Runs when: db-only or app-and-db + production-only or all-environments
  # needs: db-rollback-staging — staging must pass before production
  # Requires GitHub Environment protection (manual approval)
  # ════════════════════════════════════════════════════════════
  db-rollback-production:
    name: "🗄️ DB Rollback (production)"
    runs-on: ubuntu-latest
    needs: [confirm, db-rollback-staging]
    if: |
      ${{ always() &&
          needs.confirm.result == 'success' &&
          inputs.rollback-mode != 'app-only' &&
         (inputs.db-environments == 'production-only' ||
          inputs.db-environments == 'all-environments') }}
    timeout-minutes: 15
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":       "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":       "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Fetch production DB password from Key Vault
        id: secrets-prod
        run: |
          KV_NAME=$(echo "${{ vars.KEY_VAULT_URI }}" \
            | sed 's|https://||;s|.vault.azure.net/||')
          RAW=$(az keyvault secret show \
            --vault-name "$KV_NAME" \
            --name "${{ vars.DB_PASSWORD_SECRET_NAME_PRODUCTION }}" \
            --query value -o tsv)
          PG_PASS=$(echo "$RAW" | python3 -c "import sys,json; print(json.load(sys.stdin)['password'])")
          echo "::add-mask::$PG_PASS"
          echo "pg_pass=$PG_PASS" >> $GITHUB_OUTPUT

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Run compensating migration (production)
        env:
          PGPASSWORD: ${{ steps.secrets-prod.outputs.pg_pass }}
        run: |
          SCRIPT="migrations/${{ inputs.compensating-script }}"

          if [ ! -f "$SCRIPT" ]; then
            echo "::error::Script not found: $SCRIPT"
            exit 1
          fi

          echo "▶ Running compensating migration on production: ${{ vars.PG_DATABASE_PRODUCTION }}"
          echo "→ Script: $SCRIPT"
          psql \
            --host="${{ vars.PG_HOST }}" \
            --username="${{ vars.PG_ADMIN_USER }}" \
            --dbname="${{ vars.PG_DATABASE_PRODUCTION }}" \
            --set ON_ERROR_STOP=1 \
            --file="$SCRIPT"
          echo "✅ Production DB rollback complete."

      - name: Post production DB rollback summary
        if: always()
        run: |
          echo "## 🗄️ DB Rollback — production" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Database | \`${{ vars.PG_DATABASE_PRODUCTION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Script   | \`${{ inputs.compensating-script }}\` |" >> $GITHUB_STEP_SUMMARY

  # ════════════════════════════════════════════════════════════
  # JOB 5 — App Rollback (blue-green swap back)
  # Runs when: app-only or app-and-db
  # For app-and-db: waits for ALL db rollbacks to pass first
  # Requires GitHub Environment protection (manual approval)
  # ════════════════════════════════════════════════════════════
  app-rollback:
    name: "⏪ App Rollback (swap back)"
    runs-on: ubuntu-latest
    needs: [confirm, db-rollback-dev, db-rollback-staging, db-rollback-production]
    if: |
      ${{ always() &&
          needs.confirm.result == 'success' &&
          inputs.rollback-mode != 'db-only' }}
    timeout-minutes: 10
    environment:
      name: production

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":       "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":       "${{ secrets.AZURE_TENANT_ID }}"
            }

      # ── Show current state before swap ──────────────────────
      - name: Show current slot state
        run: |
          echo "🔍 Current slot state before rollback..."
          echo "────────────────────────────────────────"

          PROD_IMAGE=$(az webapp config container show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_APP_SERVICE_NAME }}" \
            --query "DOCKER_CUSTOM_IMAGE_NAME" -o tsv 2>/dev/null || echo "unknown")

          STAGING_IMAGE=$(az webapp config container show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_APP_SERVICE_NAME }}" \
            --slot "${{ vars.AZURE_APP_SERVICE_SLOT_STAGING }}" \
            --query "DOCKER_CUSTOM_IMAGE_NAME" -o tsv 2>/dev/null || echo "unknown")

          echo "Production (will be restored FROM staging):"
          echo "  Current image : $PROD_IMAGE"
          echo "Staging (will become new production):"
          echo "  Restore image : $STAGING_IMAGE"
          echo "────────────────────────────────────────"

          echo "PROD_IMAGE=$PROD_IMAGE"       >> $GITHUB_ENV
          echo "STAGING_IMAGE=$STAGING_IMAGE" >> $GITHUB_ENV

          PROD_URL=$(az webapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_APP_SERVICE_NAME }}" \
            --query defaultHostName -o tsv)
          echo "PROD_URL=https://$PROD_URL"   >> $GITHUB_ENV

      # ── Verify slot-sticky settings before swap ──────────────
      - name: Verify slot-sticky settings
        run: |
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APP="${{ vars.AZURE_APP_SERVICE_NAME }}"
          STAGING_SLOT="${{ vars.AZURE_APP_SERVICE_SLOT_STAGING }}"
          FAIL=0

          echo "🔍 Verifying slot-sticky settings on both slots..."
          echo "────────────────────────────────────────"

          REQUIRED_STICKY=(
            "ASPNETCORE_ENVIRONMENT"
            "ConnectionStrings__Database"
            "Secrets__DatabaseConfig"
            "KeyVault__Uri"
          )

          echo "── Staging slot ────────────────────────"
          for SETTING in "${REQUIRED_STICKY[@]}"; do
            RESULT=$(az webapp config appsettings list \
              --resource-group "$RG" --name "$APP" --slot "$STAGING_SLOT" \
              --query "[?name=='$SETTING'] | [0]" -o json)
            VALUE=$(echo "$RESULT" | jq -r '.value // "NOT FOUND"')
            STICKY=$(echo "$RESULT" | jq -r '.slotSetting // false')
            if [ "$VALUE" = "NOT FOUND" ] || [ "$STICKY" != "true" ]; then
              echo "❌ $SETTING — NOT slot-sticky"
              FAIL=$((FAIL + 1))
            else
              echo "✅ $SETTING = '$VALUE'"
            fi
          done

          echo "── Production slot ─────────────────────"
          for SETTING in "${REQUIRED_STICKY[@]}"; do
            RESULT=$(az webapp config appsettings list \
              --resource-group "$RG" --name "$APP" \
              --query "[?name=='$SETTING'] | [0]" -o json)
            VALUE=$(echo "$RESULT" | jq -r '.value // "NOT FOUND"')
            STICKY=$(echo "$RESULT" | jq -r '.slotSetting // false')
            if [ "$VALUE" = "NOT FOUND" ] || [ "$STICKY" != "true" ]; then
              echo "❌ $SETTING — NOT slot-sticky"
              FAIL=$((FAIL + 1))
            else
              echo "✅ $SETTING = '$VALUE'"
            fi
          done

          echo "────────────────────────────────────────"
          if [ $FAIL -ne 0 ]; then
            echo "::error::$FAIL slot-sticky setting(s) misconfigured — rollback blocked."
            exit 1
          fi
          echo "✅ Slot-sticky settings verified — safe to swap back."

      # ── Swap back ────────────────────────────────────────────
      - name: Swap staging → production (rollback)
        run: |
          echo "⏪ Swapping staging → production (rollback)..."
          az webapp deployment slot swap \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name           "${{ vars.AZURE_APP_SERVICE_NAME }}" \
            --slot           "${{ vars.AZURE_APP_SERVICE_SLOT_STAGING }}" \
            --target-slot    production
          echo "✅ Swap complete."

      # ── Verify production health ─────────────────────────────
      - name: Verify production health post-rollback
        run: |
          PROD_URL=$(az webapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name           "${{ vars.AZURE_APP_SERVICE_NAME }}" \
            --query defaultHostName -o tsv)

          echo "Checking production: https://$PROD_URL/health"
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://$PROD_URL/health" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Production is healthy after rollback."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production health check failed after rollback!"
          exit 1

      # ── Final summary ────────────────────────────────────────
      - name: Post rollback summary
        if: always()
        run: |
          echo "## ⏪ Rollback Summary"                                 >> $GITHUB_STEP_SUMMARY
          echo ""                                                        >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |"                                       >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|"                                       >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by   | @${{ github.actor }} |"             >> $GITHUB_STEP_SUMMARY
          echo "| Reason         | ${{ inputs.reason }} |"             >> $GITHUB_STEP_SUMMARY
          echo "| Mode           | ${{ inputs.rollback-mode }} |"      >> $GITHUB_STEP_SUMMARY
          echo "| Removed image  | \`${{ env.PROD_IMAGE }}\` |"        >> $GITHUB_STEP_SUMMARY
          echo "| Restored image | \`${{ env.STAGING_IMAGE }}\` |"     >> $GITHUB_STEP_SUMMARY
          echo "| Production URL | ${{ env.PROD_URL }} |"              >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.rollback-mode }}" != "app-only" ]; then
            echo "| DB script | \`${{ inputs.compensating-script }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| DB envs   | ${{ inputs.db-environments }} |"       >> $GITHUB_STEP_SUMMARY
          fi