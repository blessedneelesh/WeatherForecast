# =============================================================
# SonarQube Project Configuration
# Place this file in the ROOT of your repository
# Documentation: https://docs.sonarqube.org/latest/analysis/analysis-parameters/
# =============================================================

# ── Project identification ───────────────────────────────────
# This must match the key you use in your GitHub Actions workflow
sonar.projectKey=blessedneelesh_WeatherForecast
sonar.projectName=Weather Forecast API
sonar.projectVersion=1.0

# ── Source & encoding ────────────────────────────────────────
sonar.sources=WebApplication1
sonar.tests=WeatherForecast.Tests
sonar.sourceEncoding=UTF-8

# ── Language ─────────────────────────────────────────────────
sonar.language=cs

# ── Coverage report paths ────────────────────────────────────
# Path to the OpenCover XML generated by dotnet-coverage
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

# Path to TRX test results
sonar.cs.vstest.reportsPaths=**/TestResults/*.trx

# ── Exclusions ───────────────────────────────────────────────
# Exclude auto-generated files from analysis
sonar.exclusions=\
  **/Migrations/**,\
  **/wwwroot/**,\
  **/*.Designer.cs,\
  **/*.g.cs,\
  **/obj/**,\
  **/bin/**

# Exclude test projects from coverage requirement
sonar.coverage.exclusions=\
  **/*Tests*/**,\
  **/*Test*/**,\
  **/Program.cs,\
  **/Startup.cs,\
  **/GlobalUsings.cs

# Exclude generated code from duplication detection
sonar.cpd.exclusions=\
  **/Migrations/**,\
  **/*.Designer.cs

# ── Quality Gate settings ────────────────────────────────────
# The workflow will wait for the Quality Gate and fail if not met
# Configure your gate in the SonarQube/SonarCloud UI:
#   - Coverage >= 80%
#   - Duplicated Lines <= 3%
#   - Maintainability Rating = A
#   - Reliability Rating = A
#   - Security Rating = A
#   - Security Hotspots Reviewed = 100%

# ── Branch analysis (SonarQube Developer Edition+) ───────────
# sonar.branch.name is set automatically by the scanner from git
# For Community Edition, use SonarCloud which supports branches for free
